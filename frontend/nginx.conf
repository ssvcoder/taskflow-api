# Serves the built React app and proxies /api/* to the backend container.
server {
    listen 80;

    # API requests go to the ASP.NET Core container (path preserved: /api/projects -> /api/projects).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else serves the SPA, falling back to index.html for client-side routes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
