services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend/TaskFlow.Api
    container_name: taskflow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=taskflow;Username=postgres;Password=postgres"
      # In production, inject a real secret instead of this dev value.
      Jwt__Key: "dev-only-secret-key-replace-me-in-production-0123456789abcdef"
      Jwt__Issuer: "TaskFlow.Api"
      Jwt__Audience: "TaskFlow.Api"
      Jwt__ExpiryMinutes: "120"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: taskflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
